<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView</title>
</head>
<body>
    <div id="tv_chart_container" style="width: 100%; height: 600px;"></div>

    <script src="/tradingview/charting_library/charting_library.standalone.js"></script>
    <script src="/datafeed.js"></script>
    <script>
        TradingView.onready(function() {
            var widget = new TradingView.widget({
                fullscreen: false,
                symbol: 'BTCUSDT',
                interval: '15',
                container_id: 'tv_chart_container',
                datafeed: new window.Datafeed(),
                library_path: '/tradingview/charting_library/',
                theme: 'dark',
            });
        });
    </script>
</body>
</html>
